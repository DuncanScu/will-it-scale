apiVersion: apps/v1
kind: Deployment
metadata:
  name: scale-street
  labels:
    app.kubernetes.io/name: scale-street
spec:
  replicas: 3
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: scale-street
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scale-street
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: scale-street
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: scale-street
      containers:
        - name: scale-street
          image: SCALE_STREET_IMAGE
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SCALE_STREET_AGENT_MODE
              value: foundry
            - name: SCALE_STREET_SCALE_PROFILE
              value: improved
            - name: FOUNDRY_PROJECT_ENDPOINT
              value: FOUNDRY_PROJECT_ENDPOINT_VALUE
            - name: FOUNDRY_MODEL
              value: gpt-5-mini
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi

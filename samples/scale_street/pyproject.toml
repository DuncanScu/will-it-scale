[project]
name = "scale-street"
version = "0.1.0"
description = "A financial-services demo application for Will It Scale?"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-foundry>=1.0.0",
    "azure-identity>=1.19.0",
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.10.0",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC"]

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

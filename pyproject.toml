[project]
name = "will-it-scale"
version = "0.1.0"
description = "Read-only AKS deployment assessment agent: deterministic checks plus optional Azure AI Foundry interpretation."
readme = "README.md"
authors = [
    { name = "Duncan Scuffell", email = "dscuffell@microsoft.com" }
]
requires-python = ">=3.14"
dependencies = [
    "azure-ai-projects>=2.1.0",
    "azure-identity>=1.19.0",
    "azure-mgmt-containerservice>=34.0.0",
    "kubernetes>=31.0.0",
    "openai>=1.54.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
will-it-scale = "will_it_scale.main:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
